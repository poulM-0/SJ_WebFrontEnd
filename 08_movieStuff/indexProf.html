<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Favorite Movies</title>
    <link rel="stylesheet" href="styleProf.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="backdrop"></div>
    <div class="modal" id="add-modal">
      <form id="form">
      <div class="modal__content">
          <label for="title">Movie Title</label>
          <input type="text" name="title" id="title" required />
          <label for="image-url">Image URL</label>
          <input type="text" name="image-url" id="image-url" required />
          <label for="rating" >Your Rating</label>
          <input
            type="number"
            step="0.01"
            max="5"
            min="1"
            name="rating"
            id="rating"
            required
          />
        </div>
        <div class="modal__actions">
          <button id="btnCancel" class="btn btn--passive">Cancel</button>
          <input type="submit" id="btnAdd" class="btn btn--success" value="Add"/>
        </div>
      </form>
    </div>
    <div class="modal" id="delete-modal">
      <h2 class="modal__title">Are you sure?</h2>
      <p class="modal__content">
        Are you sure you want to delete this item? This action can't be made
        undone!
      </p>
      <div class="modal__actions">
        <button id="btnRegret" class="btn btn--passive">No (Cancel)</button>
        <button id="btdDestroy" class="btn btn--danger" onclick="removeFilm(this.id)">Yes</button>
      </div>
    </div>

    <header>
      <h1>Favorite Movies</h1>
      <div style="display: flex; gap: 5px;">
        <button id="clickMe">ADD MOVIE</button>
        <button id="dark" onclick="darkmode()" class="btnextra"> <svg class="w-[20px] h-[20px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="1 0 22 22">
        <path fill-rule="evenodd" d="M13 3a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0V3ZM6.343 4.929A1 1 0 0 0 4.93 6.343l1.414 1.414a1 1 0 0 0 1.414-1.414L6.343 4.929Zm12.728 1.414a1 1 0 0 0-1.414-1.414l-1.414 1.414a1 1 0 0 0 1.414 1.414l1.414-1.414ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm-9 4a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2H3Zm16 0a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2ZM7.757 17.657a1 1 0 1 0-1.414-1.414l-1.414 1.414a1 1 0 1 0 1.414 1.414l1.414-1.414Zm9.9-1.414a1 1 0 0 0-1.414 1.414l1.414 1.414a1 1 0 0 0 1.414-1.414l-1.414-1.414ZM13 19a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0v-2Z" clip-rule="evenodd"/></svg></button>
      </div>
    </header>

    <main>
      <section id="entry-text" class="card">
        <p>Your personal movie database!</p>
      </section>
      <div class="add-ons_Space"> 
        <select name="Sort" id="Sort" class="Sort hidden">
          <option value="Date">By Creation Date</option>
          <option value="Rlow">Rating low->high</option>
          <option value="Rhigh">Rating high->low</option>
        </select>
        <button class="orderbtn" id="orderbtn" style="display: none;">
          <svg class="w-[35px] h-[35px] text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="1.5" d="M9 8h10M9 12h10M9 16h10M4.99 8H5m-.02 4h.01m0 4H5"/>
          </svg>
        </button>
      </div>
      <ul id="movie-list"></ul>
    </main>
  </body>
</html>
